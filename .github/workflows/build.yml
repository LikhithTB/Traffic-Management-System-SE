name: Build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile (warnings are errors)
        run: make
      - name: Unit tests
        run: make test
      - name: Line coverage (>= 70 %)
        run: bash tools/coverage.sh 70
      - name: Cyclomatic complexity (<= 10 per function)
        run: |
          pip install lizard
          bash tools/complexity.sh
